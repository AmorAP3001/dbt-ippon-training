models:
  - name: restaurants__benefit_orders_hourly
    description: This table contains restaurants__benefit_orders_hourly
    tests:
      - dbt_utils.equality:
          compare_model: ref('expect_restaurants__benefit_orders_hourly')
          tags: ['unit_testing']
    columns:
      - name: IDENTIFIER
        description: This is a unique identifier for the restaurants__benefit_orders_hourly 
        tests:
          - unique
          - not_null
unit_tests:
  - name: test_is_valid_benefit_orders_hourly
    description: "Check my restaurants__benefit_orders_hourly"
    model: restaurants__benefit_orders_hourly
    given:
      - input: ref('stg_orders__dishes_flattened')
        rows:
          - {dishes_id: 1}
          - {dishes_id: 1}
          - {dishes_id: 1}
      - input: ref('base_dishes')
        rows:
          - {identifier: 1}
    expect:
